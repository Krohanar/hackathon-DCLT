apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: donation-service-sre-alerts
  namespace: solidarytech
  labels:
    release: solidarytech-monitoring
    app.kubernetes.io/name: donation-service
spec:
  groups:
    - name: donation-service-sre
      rules:
        - alert: DonationServiceHighErrorRate
          expr: |
            (
              sum(rate(solidarytech_donation_service_http_requests_total{status=~"5.."}[5m]))
              /
              clamp_min(sum(rate(solidarytech_donation_service_http_requests_total[5m])), 0.001)
            ) > 0.01
          for: 2m
          labels:
            severity: warning
            service: donation-service
            slo: availability
          annotations:
            summary: "Donation Service com taxa de erro 5xx acima de 1%"
            description: "O donation-service apresentou taxa de erro HTTP 5xx acima de 1% nos últimos 5 minutos."

        - alert: DonationServiceHighLatencyP95
          expr: |
            histogram_quantile(
              0.95,
              sum(rate(solidarytech_donation_service_http_request_duration_seconds_bucket[5m])) by (le)
            ) > 0.5
          for: 2m
          labels:
            severity: warning
            service: donation-service
            slo: latency
          annotations:
            summary: "Donation Service com latência p95 acima de 500ms"
            description: "O donation-service apresentou latência p95 acima de 500ms nos últimos 5 minutos."
