apiVersion: batch/v1
kind: Job
metadata:
  name: solidarytech-db-migration
  namespace: solidarytech
spec:
  ttlSecondsAfterFinished: 3600
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: db-migration
          image: postgres:16-alpine
          env:
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: solidarytech-secrets
                  key: RDS_PASSWORD
            - name: RDS_USERNAME
              valueFrom:
                secretKeyRef:
                  name: solidarytech-secrets
                  key: RDS_USERNAME
            - name: RDS_HOST
              valueFrom:
                configMapKeyRef:
                  name: solidarytech-config
                  key: RDS_HOST
            - name: RDS_PORT
              valueFrom:
                configMapKeyRef:
                  name: solidarytech-config
                  key: RDS_PORT
          command:
            - /bin/sh
            - -c
          args:
            - |
              echo "Aguardando RDS responder..."
              until pg_isready -h "$RDS_HOST" -p "$RDS_PORT" -U "$RDS_USERNAME"; do
                sleep 5
              done

              echo "Criando tabela ngos no banco ngo_db..."
              psql -h "$RDS_HOST" -p "$RDS_PORT" -U "$RDS_USERNAME" -d ngo_db -v ON_ERROR_STOP=1 <<'SQL'
              CREATE EXTENSION IF NOT EXISTS "uuid-ossp";

              CREATE TABLE IF NOT EXISTS ngos (
                id UUID PRIMARY KEY DEFAULT uuid_generate_v4(),
                name VARCHAR(255) NOT NULL,
                email VARCHAR(255) UNIQUE NOT NULL,
                city VARCHAR(255) NOT NULL,
                cause VARCHAR(255) NOT NULL,
                created_at TIMESTAMP DEFAULT CURRENT_TIMESTAMP
              );

              INSERT INTO ngos (name, email, city, cause)
              VALUES
                ('Casa Esperanca', 'contato@casaesperanca.org', 'Sao Paulo', 'Food'),
                ('Mao Amiga', 'contato@maoamiga.org', 'Rio de Janeiro', 'Clothes')
              ON CONFLICT (email) DO NOTHING;
              SQL

              echo "Garantindo banco donation_db..."
              psql -h "$RDS_HOST" -p "$RDS_PORT" -U "$RDS_USERNAME" -d postgres -v ON_ERROR_STOP=1 <<'SQL'
              SELECT 'CREATE DATABASE donation_db'
              WHERE NOT EXISTS (
                SELECT FROM pg_database WHERE datname = 'donation_db'
              )\gexec
              SQL

              echo "Criando tabela donations no banco donation_db..."
              psql -h "$RDS_HOST" -p "$RDS_PORT" -U "$RDS_USERNAME" -d donation_db -v ON_ERROR_STOP=1 <<'SQL'
              CREATE TABLE IF NOT EXISTS donations (
                id SERIAL PRIMARY KEY,
                ngo_id INT NOT NULL,
                amount NUMERIC(10,2) NOT NULL,
                donor_name VARCHAR(100) NOT NULL,
                status VARCHAR(20) NOT NULL DEFAULT 'RECEIVED',
                created_at TIMESTAMP WITH TIME ZONE DEFAULT CURRENT_TIMESTAMP
              );
              SQL

              echo "Migracao concluida."
