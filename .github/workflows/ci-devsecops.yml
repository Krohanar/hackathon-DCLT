name: CI DevSecOps

on:
  pull_request:
  push:
    branches:
      - main
      - fase-5-implementacao
  workflow_dispatch:

jobs:
  python-services:
    name: Python checks - ${{ matrix.service }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        service:
          - ngo-service
          - volunteer-service

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        working-directory: ${{ matrix.service }}
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install flake8 bandit

      - name: Python syntax check
        working-directory: ${{ matrix.service }}
        run: |
          python -m py_compile app.py

      - name: Lint with flake8
        working-directory: ${{ matrix.service }}
        run: |
          flake8 app.py --max-line-length=140

      - name: Security scan with Bandit
        working-directory: ${{ matrix.service }}
        run: |
          bandit -r . -ll --exit-zero

  go-service:
    name: Go checks - donation-service
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.21"

      - name: Download dependencies
        working-directory: donation-service
        run: |
          go mod download

      - name: Run Go tests
        working-directory: donation-service
        run: |
          go test ./...

  docker-build:
    name: Docker build validation
    runs-on: ubuntu-latest
    needs:
      - python-services
      - go-service

    strategy:
      fail-fast: false
      matrix:
        include:
          - service: ngo-service
            context: ngo-service
          - service: donation-service
            context: donation-service
          - service: volunteer-service
            context: volunteer-service

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build image
        run: |
          docker build -t solidarytech-${{ matrix.service }}:ci ./${{ matrix.context }}

  trivy-scan:
    name: Trivy filesystem scan
    runs-on: ubuntu-latest
    needs:
      - docker-build

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run Trivy scan
        run: |
          docker run --rm -v "$PWD:/src" aquasec/trivy:latest fs \
            --severity HIGH,CRITICAL \
            --exit-code 0 \
            /src
