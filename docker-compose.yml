services:
  postgres:
    image: postgres:16-alpine
    container_name: solidarytech-postgres
    environment:
      POSTGRES_USER: solidary
      POSTGRES_PASSWORD: solidary
      POSTGRES_DB: solidary
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U solidary"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - solidarytech

  localstack:
    image: localstack/localstack:3.8.1
    container_name: solidarytech-localstack
    environment:
      SERVICES: sqs,dynamodb
      AWS_DEFAULT_REGION: us-east-1
      DEBUG: "0"
    ports:
      - "4566:4566"
    volumes:
      - localstack_data:/var/lib/localstack
      - /var/run/docker.sock:/var/run/docker.sock
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4566/_localstack/health"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks:
      - solidarytech

  localstack-init:
    image: localstack/localstack:3.8.1
    container_name: solidarytech-localstack-init
    depends_on:
      localstack:
        condition: service_healthy
    environment:
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
      AWS_DEFAULT_REGION: us-east-1
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -e

        echo "Criando fila SQS solidary-donations..."
        awslocal --endpoint-url=http://localstack:4566 sqs create-queue --queue-name solidary-donations || true

        echo "Criando tabela DynamoDB SolidaryTechVolunteers..."
        awslocal --endpoint-url=http://localstack:4566 dynamodb create-table \
          --table-name SolidaryTechVolunteers \
          --attribute-definitions AttributeName=volunteer_id,AttributeType=S \
          --key-schema AttributeName=volunteer_id,KeyType=HASH \
          --billing-mode PAY_PER_REQUEST || true

        echo "Conferindo recursos criados..."
        awslocal --endpoint-url=http://localstack:4566 sqs list-queues || true
        awslocal --endpoint-url=http://localstack:4566 dynamodb list-tables || true

        echo "Recursos locais AWS criados com sucesso."
    networks:
      - solidarytech

  ngo-service:
    build:
      context: ./ngo-service
    container_name: solidarytech-ngo-service
    environment:
      PORT: "8081"
      DATABASE_URL: postgresql://solidary:solidary@postgres:5432/ngo_db
    ports:
      - "8081:8081"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - solidarytech

  donation-service:
    build:
      context: ./donation-service
    container_name: solidarytech-donation-service
    environment:
      PORT: "8082"
      DATABASE_URL: postgres://solidary:solidary@postgres:5432/donation_db?sslmode=disable
      AWS_REGION: us-east-1
      AWS_ENDPOINT_URL: http://localstack:4566
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
      AWS_SQS_URL: http://localstack:4566/000000000000/solidary-donations
    ports:
      - "8082:8082"
    depends_on:
      postgres:
        condition: service_healthy
      localstack-init:
        condition: service_completed_successfully
    networks:
      - solidarytech

  volunteer-service:
    build:
      context: ./volunteer-service
    container_name: solidarytech-volunteer-service
    environment:
      PORT: "8083"
      AWS_REGION: us-east-1
      AWS_ENDPOINT_URL: http://localstack:4566
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
      AWS_DYNAMODB_TABLE: SolidaryTechVolunteers
    ports:
      - "8083:8083"
    depends_on:
      localstack-init:
        condition: service_completed_successfully
    networks:
      - solidarytech

volumes:
  postgres_data:
  localstack_data:

networks:
  solidarytech:
    driver: bridge
